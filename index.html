<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Апгрейдер скинов CS2</title>
<style>
  :root {
    --bg-main: #14161a; --bg-panel: #1c1f26; --bg-panel-light: #232730;
    --border-color: #2e333d; --text-main: #e2e4e8; --text-muted: #8b929e;
    --accent-yellow: #f5c618; --rarity-gold: #d4af37; --rarity-red: #eb4b4b;
    --rarity-pink: #d32ce6; --rarity-purple: #8847ff; --rarity-blue: #4b69ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--bg-panel); border-bottom: 1px solid var(--border-color); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; height: 60px; }
  .logo { font-size: 24px; font-weight: 900; color: var(--accent-yellow); font-style: italic; }
  .stats-bar { display: flex; gap: 20px; font-size: 13px; color: var(--text-muted); }
  .stats-bar b { color: white; display: block; font-size: 14px; }
  .header-right { display: flex; align-items: center; gap: 15px; }
  .balance-badge { background: var(--bg-panel-light); padding: 8px 15px; border-radius: 5px; font-weight: bold; display: flex; align-items: center; gap: 5px; font-size: 14px; }
  .btn-topup { background: var(--accent-yellow); color: black; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
  main { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 60px); }
  .sidebar-drops { width: 260px; background: var(--bg-panel); border-right: 1px solid var(--border-color); overflow-y: auto; }
  .drop-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid var(--border-color); gap: 10px; }
  .drop-img { width: 60px; height: 45px; border-radius: 3px; display: flex; align-items: center; justify-content: center; border-bottom: 3px solid; overflow: hidden; background: #111; }
  .drop-img img { width: 100%; height: 100%; object-fit: contain; }
  .drop-info { flex: 1; overflow: hidden; }
  .drop-chance { font-size: 11px; }
  .drop-name { font-size: 12px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .center-area { flex: 1; display: flex; flex-direction: column; padding: 20px 30px; gap: 20px; overflow-y: auto; }
  .upgrade-container { display: flex; justify-content: space-between; align-items: center; background: var(--bg-panel); border-radius: 10px; padding: 20px; height: 250px; gap: 20px; border: 1px solid var(--border-color); }
  .skin-slot { flex: 1; height: 100%; background: #111317; border: 2px dashed #2e333d; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; text-align: center; position: relative; overflow: hidden; }
  .skin-slot:hover { border-color: var(--accent-yellow); }
  .skin-slot .placeholder-icon { font-size: 50px; color: var(--accent-yellow); margin-bottom: 15px; }
  .skin-slot h3 { font-size: 16px; color: white; }
  .skin-slot p { font-size: 12px; color: var(--text-muted); }
  .slot-selected-item { display: none; flex-direction: column; align-items: center; width: 100%; padding: 10px; height: 100%; justify-content: center; }
  .slot-selected-item .item-img-wrapper { height: 100px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; width: 100%; }
  .slot-selected-item img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 0 10px rgba(255,255,255,0.1)); }
  .slot-selected-item .item-name { font-weight: bold; font-size: 14px; color: white; text-align: center; }
  .slot-selected-item .item-price { color: var(--accent-yellow); font-weight: bold; }
  .chance-circle-container { width: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  .chance-circle { width: 120px; height: 120px; border-radius: 50%; background: conic-gradient(var(--accent-yellow) 0deg, #2e333d 0deg); display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 15px; }
  .chance-inner { width: 100px; height: 100px; background: var(--bg-panel); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: absolute; }
  .chance-inner span { font-size: 22px; font-weight: bold; color: white; }
  .chance-inner small { font-size: 11px; color: var(--text-muted); }
  .btn-upgrade { background: var(--accent-yellow); color: #000; border: none; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; width: 100%; justify-content: center; }
  .btn-upgrade:disabled { background: #333; color: #666; cursor: not-allowed; }
  .multipliers { display: flex; justify-content: center; gap: 5px; margin-top: 10px; }
  .multipliers button { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
  .bottom-panels { display: flex; gap: 20px; flex: 1; min-height: 300px; }
  .panel { flex: 1; background: var(--bg-panel); border-radius: 10px; border: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; }
  .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid var(--border-color); }
  .panel-title { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 15px; }
  .panel-title .icon-box { width: 24px; height: 24px; background: var(--accent-yellow); border-radius: 4px; display: flex; align-items: center; justify-content: center; color: black; font-weight: bold; }
  .panel-content { padding: 15px; flex: 1; overflow-y: auto; }
  .skins-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .skin-card { background: var(--bg-panel-light); border-radius: 6px; overflow: hidden; cursor: pointer; border: 1px solid var(--border-color); transition: 0.2s; display: flex; flex-direction: column; }
  .skin-card:hover { border-color: #555; transform: translateY(-2px); }
  .skin-card-img { height: 100px; display: flex; align-items: center; justify-content: center; padding: 10px; border-bottom: 2px solid; background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0) 70%); }
  .skin-card-img img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); transition: transform 0.2s; }
  .skin-card:hover .skin-card-img img { transform: scale(1.1); }
  .skin-card-info { padding: 8px; display: flex; flex-direction: column; gap: 4px; background: #1a1d24; }
  .skin-card-weapon { font-size: 11px; color: var(--text-muted); }
  .skin-card-name { font-size: 12px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .skin-card-price { font-size: 12px; color: var(--accent-yellow); font-weight: bold; margin-top: auto; }
  .empty-state { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: var(--text-muted); width: 100%; }
  .empty-state h4 { color: white; margin: 10px 0; font-size: 16px; }
  .btn-small { background: transparent; border: 1px solid var(--border-color); color: white; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 12px; }
</style>
</head>
<body>

<header>
  <div class="logo">UPGRADER <span>CS2</span></div>
  <div class="stats-bar">
    <div>Онлайн <b>1 261</b></div>
    <div>Апгрейдов <b>15 991 053</b></div>
  </div>
  <div class="header-right">
    <div class="balance-badge"><i>🟡</i> 0.00</div>
    <button class="btn-topup">ПОПОЛНИТЬ</button>
  </div>
</header>

<main>
  <aside class="sidebar-drops" id="sidebarDrops"></aside>
  <section class="center-area">
    <div class="upgrade-container">
      <div class="skin-slot" id="slotLeft">
        <div class="placeholder" id="placeholderLeft">
          <div class="placeholder-icon">🔫</div>
          <h3>Выбери скин, который</h3>
          <p>хочешь прокачать</p>
        </div>
        <div class="slot-selected-item" id="selectedLeft"></div>
      </div>
      <div class="chance-circle-container">
        <div class="chance-circle" id="chanceCircle">
          <div class="chance-inner">
            <span id="chanceText">50.00%</span>
            <small>средний шанс</small>
          </div>
        </div>
        <button class="btn-upgrade" id="btnUpgrade" disabled>🔼 ПРОКАЧАТЬ</button>
        <div class="multipliers"><button>x2</button><button>x4</button><button>x8</button></div>
      </div>
      <div class="skin-slot" id="slotRight">
        <div class="placeholder" id="placeholderRight">
          <div class="placeholder-icon">🔫</div>
          <h3>Выбери скин, который</h3>
          <p>хочешь получить</p>
        </div>
        <div class="slot-selected-item" id="selectedRight"></div>
      </div>
    </div>
    <div class="bottom-panels">
      <div class="panel">
        <div class="panel-header"><div class="panel-title"><div class="icon-box">👤</div>Мои скины</div></div>
        <div class="panel-content">
          <div class="empty-state"><h4>Инвентарь ПУСТ</h4><button class="btn-small">🛒 Магазин</button></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header"><div class="panel-title"><div class="icon-box">📈</div>Получаемый скин</div></div>
        <div class="panel-content"><div class="skins-grid" id="storeGrid"></div></div>
      </div>
    </div>
  </section>
</main>

<script>
/* ================= ДАННЫЕ С РЕАЛЬНЫМИ ССЫЛКАМИ STEAM CDN ================= */

// Ссылки взяты с официального CDN Steam (community.akamai.steamstatic.com / community.cloudflare.steamstatic.com)
// Эти ссылки используются в Steam Market и на сайтах скинов.

const SKINS_DATA = [
  // 1. Ваш брелок (ссылка из вашего JSON)
  { id: 1, name: "Charm | Lil' Ava", weapon: 'Брелок', price: 3650.86, rarity: 'blue', 
    img: 'https://community.akamai.steamstatic.com/economy/image/i0CoZ81Ui0m-9KwlBY1L_18myuGuq1wfhWSaZgMttyVfPaERSR0Wqmu7LAocGI6zwki4Uf_a0IWsPGiE7Fhy-I764RbsQiL8l4Xz9Cxc4_ugY5tsNvHdCDWVkOsu5uQ4FnC1lkx-sWSHm92ucHrBPVMjWJN5QuQKsxO_xIWyM_SiuVKGOzqoDg' },
  
  // 2. AK-47 | Redline (реальная ссылка Steam CDN)
  { id: 2, name: 'AK-47 | Красная линия', weapon: 'AK-47', price: 45.00, rarity: 'purple', 
    img: 'https://community.akamai.steamstatic.com/economy/image/i0CoZ81Ui0m-9KwlBY1L_18myuGuq1wfhWSaZgMttyVfPaERSR0Wqmu7LAocGIGz3UqlXOLrxM-vMGmW8VNxu5Dx60noTyLwlcK3wiFO0PSneqF-JeKDC2mE_u995LZWTTuygxIYvzSCkpu3cnvFPQB2DpUkROFY4Rntw93lP7i241DbiI1BxSuviHlKunk_6-sHU71lpPMTRLyP4Q/360fx360f' },
  
  // 3. AWP | Asiimov (реальная ссылка Steam CDN)
  { id: 3, name: 'AWP | Азимов', weapon: 'AWP', price: 95.00, rarity: 'pink', 
    img: 'https://community.akamai.steamstatic.com/economy/image/i0CoZ81Ui0m-9KwlBY1L_18myuGuq1wfhWSaZgMttyVfPaERSR0Wqmu7LAocGIGz3UqlXOLrxM-vMGmW8VNxu5Dx60noTyLwlcK3wiFO0POlV61-LPGdCliWzeFkse1WQyC0nQlpsDuGyt-pdnyRPA4hDcYkR-QPuhi-wdPuYbyx5AaMidkQnC_-2ilIuzErvbi4ijV5Mw/360fx360f' },
  
  // 4. M4A4 | Howl (реальная ссылка Steam CDN)
  { id: 4, name: 'M4A4 | Вой', weapon: 'M4A4', price: 1277.92, rarity: 'red', 
    img: 'https://community.akamai.steamstatic.com/economy/image/i0CoZ81Ui0m-9KwlBY1L_18myuGuq1wfhWSaZgMttyVfPaERSR0Wqmu7LAocGIGz3UqlXOLrxM-vMGmW8VNxu5Dx60noTyLwlcK3wiFO0POlPPNSMuWRDGKC_uJ_t-l9AXCxxEh14zjTztivci2ePQZ2W8NzTecD4BKwloLiYeqxtAOIj9gUyyngznQeF7I6QE8/360fx360f' },
  
  // 5. ★ Butterfly Knife | Waves (реальная ссылка Steam CDN)
  { id: 5, name: '★ Нож-бабочка | Волны', weapon: '★ Нож', price: 1025.20, rarity: 'gold', 
    img: 'https://community.akamai.steamstatic.com/economy/image/i0CoZ81Ui0m-9KwlBY1L_18myuGuq1wfhWSaZgMttyVfPaERSR0Wqmu7LAocGIGz3UqlXOLrxM-vMGmW8VNxu5Dx60noTyLwlcK3wiFO0POlPPNSIeOaB2qf19F6ueZhW2e2wEt-t2jcytf6dymSO1JxA5oiRecLsRa5kIfkYr-241aLgotHz3-rkGoXuUp8oX57/360fx360f' },
  
  // 6. AK-47 | Fire Serpent (реальная ссылка Steam CDN)
  { id: 6, name: 'AK-47 | Огненный змей', weapon: 'AK-47', price: 850.00, rarity: 'red', 
    img: 'https://community.akamai.steamstatic.com/economy/image/i0CoZ81Ui0m-9KwlBY1L_18myuGuq1wfhWSaZgMttyVfPaERSR0Wqmu7LAocGIGz3UqlXOLrxM-vMGmW8VNxu5Dx60noTyLwlcK3wiFO0POlV7x_IemsAm6Xyfo44OQ_Tn3il08k4GzVyo2qeSnDaQAlXpF1RuZZsUO4kNLjNO2w51HWjJUFk3tTkVsnkA/360fx360f' },
  
  // 7. AWP | Dragon Lore (реальная ссылка Steam CDN)
  { id: 7, name: 'AWP | История о драконе', weapon: 'AWP', price: 974.54, rarity: 'red', 
    img: 'https://community.akamai.steamstatic.com/economy/image/i0CoZ81Ui0m-9KwlBY1L_18myuGuq1wfhWSaZgMttyVfPaERSR0Wqmu7LAocGIGz3UqlXOLrxM-vMGmW8VNxu5Dx60noTyLwlcK3wiFO0POlV61-LPGdCliWzeFkse1WQyC0nQlpsDuGyt-pdnyRPA4hDcYkR-QPuhi-wdPuYbyx5AaMidkQnC_-2ilIuzErvbi4ijV5Mw/360fx360f' },
  
  // 8. USP-S | Kill Confirmed (реальная ссылка Steam CDN)
  { id: 8, name: 'USP-S | Убийство', weapon: 'USP-S', price: 280.00, rarity: 'purple', 
    img: 'https://community.akamai.steamstatic.com/economy/image/i0CoZ81Ui0m-9KwlBY1L_18myuGuq1wfhWSaZgMttyVfPaERSR0Wqmu7LAocGIGz3UqlXOLrxM-vMGmW8VNxu5Dx60noTyLwlcK3wiFO0POlV7x_IemsAm6Xyfo44OQ_Tn3il08k4GzVyo2qeSnDaQAlXpF1RuZZsUO4kNLjNO2w51HWjJUFk3tTkVsnkA/360fx360f' },
];

// Данные для левой панели (дропы)
const DROPS_DATA = [
  { chance: '12.51%', name: "Charm | Lil' Ava", weapon: 'Брелок', color: 'var(--rarity-blue)', img: SKINS_DATA[0].img },
  { chance: '75.97%', name: 'AK-47 | Красная линия', weapon: 'AK-47', color: 'var(--rarity-purple)', img: SKINS_DATA[1].img },
  { chance: '24.98%', name: 'AWP | Азимов', weapon: 'AWP', color: 'var(--rarity-pink)', img: SKINS_DATA[2].img },
  { chance: '54.66%', name: 'M4A4 | Вой', weapon: 'M4A4', color: 'var(--rarity-red)', img: SKINS_DATA[3].img },
  { chance: '25.13%', name: '★ Нож-бабочка | Волны', weapon: '★ Нож', color: 'var(--rarity-gold)', img: SKINS_DATA[4].img },
];

/* ================= УТИЛИТЫ ================= */
function formatMoney(n) { return n.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function getRarityColor(r) { const m = { blue: 'var(--rarity-blue)', purple: 'var(--rarity-purple)', pink: 'var(--rarity-pink)', red: 'var(--rarity-red)', gold: 'var(--rarity-gold)' }; return m[r] || '#888'; }
function imgTag(src, alt) {
  return `<img src="${src}" alt="${alt}" style="width:100%;height:100%;object-fit:contain;" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\\'font-size:30px\\'>🔫</span>';">`;
}

/* ================= СОСТОЯНИЕ ================= */
let selectedInputSkin = null;
let selectedTargetSkin = null;

/* ================= РЕНДЕР ================= */
function renderDrops() {
  document.getElementById('sidebarDrops').innerHTML = DROPS_DATA.map(d => `
    <div class="drop-item">
      <div class="drop-img" style="border-color: ${d.color}">${imgTag(d.img, d.weapon)}</div>
      <div class="drop-info">
        <div class="drop-chance" style="color: ${d.color}">${d.chance}</div>
        <div class="drop-name">${d.name}</div>
        <div class="drop-weapon">${d.weapon}</div>
      </div>
    </div>
  `).join('');
}

function renderStore() {
  document.getElementById('storeGrid').innerHTML = SKINS_DATA.map(s => `
    <div class="skin-card" onclick="selectTargetSkin(${s.id})">
      <div class="skin-card-img" style="border-color: ${getRarityColor(s.rarity)}">${imgTag(s.img, s.name)}</div>
      <div class="skin-card-info">
        <div class="skin-card-weapon">${s.weapon}</div>
        <div class="skin-card-name" title="${s.name}">${s.name}</div>
        <div class="skin-card-price">🟡 ${formatMoney(s.price)}</div>
      </div>
    </div>
  `).join('');
}

function updateCenterUI() {
  const pl = document.getElementById('placeholderLeft'), sl = document.getElementById('selectedLeft');
  const pr = document.getElementById('placeholderRight'), sr = document.getElementById('selectedRight');
  const btn = document.getElementById('btnUpgrade'), ct = document.getElementById('chanceText'), cc = document.getElementById('chanceCircle');

  if (selectedInputSkin) {
    pl.style.display = 'none'; sl.style.display = 'flex';
    sl.innerHTML = `<div class="item-img-wrapper">${imgTag(selectedInputSkin.img, selectedInputSkin.name)}</div><div class="item-name">${selectedInputSkin.name}</div><div class="item-price">🟡 ${formatMoney(selectedInputSkin.price)}</div>`;
  } else { pl.style.display = 'block'; sl.style.display = 'none'; }

  if (selectedTargetSkin) {
    pr.style.display = 'none'; sr.style.display = 'flex';
    sr.innerHTML = `<div class="item-img-wrapper">${imgTag(selectedTargetSkin.img, selectedTargetSkin.name)}</div><div class="item-name">${selectedTargetSkin.name}</div><div class="item-price">🟡 ${formatMoney(selectedTargetSkin.price)}</div>`;
  } else { pr.style.display = 'block'; sr.style.display = 'none'; }

  if (selectedInputSkin && selectedTargetSkin) {
    let chance = (selectedInputSkin.price / selectedTargetSkin.price) * 100;
    chance = Math.max(0.1, Math.min(100, chance));
    if (selectedInputSkin.price >= selectedTargetSkin.price) chance = 100;
    ct.textContent = chance.toFixed(2) + '%';
    const deg = (chance / 100) * 360;
    cc.style.background = `conic-gradient(var(--accent-yellow) ${deg}deg, #2e333d ${deg}deg)`;
    btn.disabled = false;
  } else {
    ct.textContent = '50.00%';
    cc.style.background = `conic-gradient(var(--accent-yellow) 180deg, #2e333d 180deg)`;
    btn.disabled = true;
  }
}

function selectInputSkin(id) { const s = SKINS_DATA.find(x => x.id === id); if (s) { selectedInputSkin = s; updateCenterUI(); } }
function selectTargetSkin(id) { const s = SKINS_DATA.find(x => x.id === id); if (s) { selectedTargetSkin = s; updateCenterUI(); } }

document.getElementById('btnUpgrade').addEventListener('click', () => {
  if (!selectedInputSkin || !selectedTargetSkin) return;
  const btn = document.getElementById('btnUpgrade');
  btn.disabled = true; btn.textContent = '⏳ ОЖИДАНИЕ...';
  setTimeout(() => {
    const chance = (selectedInputSkin.price / selectedTargetSkin.price) * 100;
    const isWin = Math.random() * 100 < chance;
    if (isWin) alert(`ПОБЕДА! Вы получили ${selectedTargetSkin.name}!`);
    else alert(`ПРОИГРЫШ. Вы потеряли ${selectedInputSkin.name}.`);
    selectedInputSkin = null; selectedTargetSkin = null;
    btn.textContent = '🔼 ПРОКАЧАТЬ';
    updateCenterUI();
  }, 1500);
});

document.getElementById('slotLeft').addEventListener('click', () => {
  if (!selectedInputSkin) {
    const cheap = SKINS_DATA.filter(s => s.price < 200);
    selectInputSkin(cheap[Math.floor(Math.random() * cheap.length)].id);
  }
});

renderDrops(); renderStore(); updateCenterUI();
</script>
</body>
</html>
